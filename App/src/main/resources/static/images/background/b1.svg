<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <defs>
    <filter id="blur" x="0" y="0" width="100%" height="100%">
      <feGaussianBlur in="SourceGraphic" result="blurResult" stdDeviation="10"/>
      <feComposite in="SourceGraphic" in2="blurResult" result="compositeResult" operator="overlay"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0a1218"/>
  <radialGradient id="purpleBlur" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#604d50" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <rect width="100%" height="100%" fill="url(#purpleBlur)" filter="url(#blur)"/>
</svg>
